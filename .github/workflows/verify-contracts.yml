name: verify-contracts
on:
  workflow_dispatch:
    inputs:
      chain_id:
        description: 1 (mainnet) or 11155111 (sepolia)
        required: true
        default: "1"
      coin:
        description: Optional — one agent coin address to verify (verifying one shows the source and links on all coins)
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run contracts:build
      - run: node contracts/scripts/verify.mjs
        env:
          CHAIN_ID: ${{ inputs.chain_id }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          COIN: ${{ inputs.coin }}
          RPC_URL: ${{ inputs.chain_id == '1' && secrets.RPC_URL_MAINNET || secrets.RPC_URL_SEPOLIA }}
